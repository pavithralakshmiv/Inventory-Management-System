<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Management - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Sales Management</h1>
<form id="entityForm" novalidate><div class="split"><div>
<div class="box"><div class="field"><label>Customer</label><select id="customerId"></select></div>
<div class="field-row">
<div class="field"><label>Product</label><select id="productId"></select></div>
<div class="field-row"><div class="field"><label>Quantity</label><input type="number" id="qty" min="1" value="1"></div>
<div class="field"><label>Price</label><input type="text" id="price" readonly></div></div>
</div>
<button type="button" class="btn" id="btnAdd">➕ Add Product</button>
</div>
<div class="table-wrap mt"><table class="grid"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th><th></th></tr></thead><tbody id="cartBody"></tbody></table></div>
</div>
<div class="split-form"><div class="field"><label>Discount (%)</label><input type="number" id="discount" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>Payment Method</label><select id="paymentMethod"><option>Cash</option><option>Card</option><option>UPI</option><option>Bank Transfer</option></select></div>
<div class="totals"><div><span>Subtotal</span><span id="subtotal">0.00</span></div><div><span>Discount</span><span id="discountAmt">0.00</span></div><div class="grand"><span>Total</span><span id="total">0.00</span></div></div>
<div class="btn-row"><button type="button" class="btn" id="btnSaveTxn">💾 Save</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><button type="button" class="btn" id="btnClose">❌ Close</button></div>
</div></div></form>
<h2 class="panel-sub mt">History</h2>
<div class="toolbar"><input type="text" class="grow" id="searchBox" placeholder="Search invoice or customer"><button type="button" class="btn" id="btnSearch">🔍 Search</button><button type="button" class="btn" id="btnRefresh">🔃 Refresh</button><button type="button" class="btn" id="btnInvoice">🧾 View Invoice</button><button type="button" class="btn" id="btnCancelTxn">🚫 Cancel Sale</button></div>
<div class="table-wrap"><table class="grid"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Profit</th><th>Payment</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/sales.js"></script>
</body>
</html>
