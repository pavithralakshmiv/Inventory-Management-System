
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div class="login-wrap">
        <div class="login">

            <div class="login-left">
                <div>
                    <h1>Inventory Management System</h1>
                    <span class="tagline">Manage Your Stock Smartly</span>
                </div>

                <img src="images/inventory.svg" alt="Inventory illustration">
            </div>

            <div class="login-right">
                <h2>Welcome</h2>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" required autocomplete="username">
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" required autocomplete="current-password">
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-wide" id="btnLogin">🔓 Login</button>
                        <button type="button" class="btn btn-wide" id="btnCloseApp">❌ Close</button>
                    </div>
                </form>

                <div class="login-links">
                    <a href="register.html">Create an account</a>
                    <a href="#" id="forgotLink">Forgot password?</a>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="toast"></div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
