<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Settings</h1>
<div class="grid-2">
<div class="box"><h3>Update Profile</h3><form id="profileForm" novalidate>
<div class="field"><label>Email</label><input type="text" id="pEmail" readonly></div>
<div class="field"><label>Name</label><input type="text" id="pName" required maxlength="100"></div>
<div class="field"><label>Mobile</label><input type="tel" id="pMobile" maxlength="15" pattern="[0-9+\- ]{7,15}"></div>
<div class="field"><label>Address</label><textarea id="pAddress" maxlength="255"></textarea></div>
<button type="button" class="btn" id="btnProfile">💾 Save Profile</button></form></div>
<div class="box"><h3>Change Password</h3><form id="passwordForm" novalidate>
<div class="field"><label>Old Password</label><input type="password" id="oldPassword" required autocomplete="current-password"></div>
<div class="field"><label>New Password</label><input type="password" id="newPassword" required minlength="6" maxlength="60" autocomplete="new-password"></div>
<div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword" required autocomplete="new-password"></div>
<button type="button" class="btn" id="btnPassword">🔑 Change Password</button></form></div>
</div>
<div class="box mt"><h3>Business Information and Preferences <span class="small" id="adminNote"></span></h3><form id="businessForm" novalidate>
<div class="grid-2"><div>
<div class="field"><label>Business Name</label><input type="text" id="business_name" required maxlength="150"></div>
<div class="field"><label>Business Address</label><input type="text" id="business_address" maxlength="255"></div>
<div class="field"><label>Business Phone</label><input type="text" id="business_phone" maxlength="30"></div>
<div class="field"><label>Business Email</label><input type="email" id="business_email" maxlength="150"></div></div><div>
<div class="field"><label>Currency Symbol</label><input type="text" id="currency_symbol" maxlength="5"></div>
<div class="field"><label>Low-Stock Threshold</label><input type="number" id="low_stock_threshold" min="0" step="1" required></div>
<p class="small">Products with a quantity at or below the threshold are shown as Low Stock.</p></div></div>
<div class="btn-row"><button type="button" class="btn" id="btnSettings">💾 Save Settings</button><button type="button" class="btn" id="btnClose">❌ Close</button></div></form></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
