<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Inventory Dashboard</h1>
<div class="stats">
<a class="stat" href="products.html"><div class="icon">📦</div><div class="value" id="sProducts">0</div><div class="label">Total Products</div></a>
<a class="stat" href="customers.html"><div class="icon">👥</div><div class="value" id="sCustomers">0</div><div class="label">Total Customers</div></a>
<a class="stat" href="view-orders.html"><div class="icon">🛒</div><div class="value" id="sOrders">0</div><div class="label">Total Orders</div></a>
<a class="stat" href="stock.html?lowOnly=1"><div class="icon">⚠️</div><div class="value" id="sLow">0</div><div class="label">Low Stock</div></a>
</div>
<div class="grid-2">
<div class="box"><h3>Stock Overview (quantity by category)</h3><div class="chart-box"><canvas id="stockChart"></canvas></div></div>
<div class="box"><h3>Recent Activities</h3><ul class="activity" id="activities"></ul></div>
</div>
<div class="grid-2 mt">
<div class="box"><h3>Recently Added Products</h3><div class="table-wrap"><table class="grid"><thead><tr><th>Code</th><th>Product</th><th>Category</th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody id="recentProducts"></tbody></table></div></div>
<div class="box"><h3>Recent Orders</h3><div class="table-wrap"><table class="grid"><thead><tr><th>Order</th><th>Customer</th><th class="num">Total</th><th>Status</th></tr></thead><tbody id="recentOrders"></tbody></table></div></div>
</div></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
