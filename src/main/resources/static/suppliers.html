<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Supplier - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Manage Supplier</h1><div class="split"><div><div class="toolbar"><input type="text" class="grow" id="searchBox" placeholder="Search..."><button type="button" class="btn" id="btnSearch">🔍 Search</button><button type="button" class="btn" id="btnRefresh">🔃 Refresh</button></div><div class="table-wrap"><table class="grid"><thead><tr><th>Supplier ID</th><th>Supplier Name</th><th>Contact Person</th><th>Mobile</th><th>Email</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></div><form id="entityForm" class="split-form" novalidate><div class="field"><label>Supplier ID</label><input type="text" id="rid" readonly placeholder="Auto"></div><div class="field"><label>Supplier Name</label><input type="text" id="name" required maxlength="100"></div><div class="field"><label>Contact Person</label><input type="text" id="contactPerson" maxlength="100"></div><div class="field"><label>Mobile Number</label><input type="tel" id="mobile" maxlength="15" pattern="[0-9+\- ]{7,15}" title="7 to 15 digits"></div><div class="field"><label>Email</label><input type="email" id="email" maxlength="150"></div><div class="field"><label>Address</label><textarea id="address" maxlength="255"></textarea></div><div class="field"><label>Status</label><select id="status" required><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="btn-row"><button type="button" class="btn" id="btnSave">💾 Save</button><button type="button" class="btn" id="btnUpdate">✏️ Update</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><button type="button" class="btn" id="btnDelete">🗑️ Delete</button><button type="button" class="btn" id="btnHistory">📜 Purchases</button><button type="button" class="btn" id="btnClose">❌ Close</button></div></form></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/suppliers.js"></script>
</body>
</html>
