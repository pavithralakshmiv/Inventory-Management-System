<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div class="center-panel"><div class="panel"><h1 class="panel-title">User Registration</h1>
<form id="registerForm" novalidate>
<div class="field"><label>Name</label><input type="text" id="name" required maxlength="100"></div>
<div class="field"><label>Email</label><input type="email" id="email" required maxlength="150" autocomplete="username"></div>
<div class="field"><label>Mobile Number</label><input type="tel" id="mobile" required maxlength="15" pattern="[0-9+\- ]{7,15}" title="7 to 15 digits"></div>
<div class="field"><label>Password</label><input type="password" id="password" required minlength="6" maxlength="60" autocomplete="new-password"></div>
<div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword" required autocomplete="new-password"></div>
<div class="field"><label>Address</label><textarea id="address" maxlength="255"></textarea></div>
<div class="btn-row"><button type="submit" class="btn" id="btnRegister">✅ Register</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><a class="btn" href="index.html">⬅️ Back to Login</a></div>
</form></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
