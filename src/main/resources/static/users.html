<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Users - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Manage Users</h1><div class="split"><div><div class="toolbar"><input type="text" class="grow" id="searchBox" placeholder="Search..."><button type="button" class="btn" id="btnSearch">🔍 Search</button><button type="button" class="btn" id="btnRefresh">🔃 Refresh</button></div><div class="table-wrap"><table class="grid"><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Address</th><th>Status</th><th>Role</th></tr></thead><tbody id="tbody"></tbody></table></div></div><form id="entityForm" class="split-form" novalidate><div class="field"><label>ID</label><input type="text" id="rid" readonly placeholder="Auto"></div><div class="field"><label>Name</label><input type="text" id="name" required maxlength="100"></div><div class="field"><label>Mobile Number</label><input type="tel" id="mobile" maxlength="15" pattern="[0-9+\- ]{7,15}" title="7 to 15 digits"></div><div class="field"><label>Email</label><input type="email" id="email" required maxlength="150"></div><div class="field"><label>Password</label><input type="password" id="password" minlength="6" maxlength="60" placeholder="Leave blank to keep current" autocomplete="new-password"></div><div class="field"><label>Address</label><textarea id="address" maxlength="255"></textarea></div><div class="field"><label>Status</label><select id="status" required><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="field"><label>Role</label><select id="role" required><option value="EMPLOYEE">EMPLOYEE</option><option value="ADMIN">ADMIN</option></select></div><div class="btn-row"><button type="button" class="btn" id="btnSave">💾 Save</button><button type="button" class="btn" id="btnUpdate">✏️ Update</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><button type="button" class="btn" id="btnDelete">🗑️ Delete</button><button type="button" class="btn" id="btnClose">❌ Close</button></div></form></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/users.js"></script>
</body>
</html>
