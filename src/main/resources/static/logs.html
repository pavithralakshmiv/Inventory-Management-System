<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Logs - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">User Logs</h1>
<div class="toolbar"><input type="text" class="grow" id="searchBox" placeholder="Search user or description">
<select id="actionFilter"><option value="">All Actions</option></select>
<label class="lbl" style="margin:0">From</label><input type="date" id="fromDate"><label class="lbl" style="margin:0">To</label><input type="date" id="toDate">
<button type="button" class="btn" id="btnSearch">🔍 Search</button><button type="button" class="btn" id="btnRefresh">🔃 Refresh</button><button type="button" class="btn" id="btnClose">❌ Close</button></div>
<div class="table-wrap"><table class="grid"><thead><tr><th>Log ID</th><th>User</th><th>Action</th><th>Description</th><th>Date and Time</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/logs.js"></script>
</body>
</html>
