<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Category - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Manage Category</h1><div class="split"><div><div class="toolbar"><input type="text" class="grow" id="searchBox" placeholder="Search..."><button type="button" class="btn" id="btnSearch">🔍 Search</button><button type="button" class="btn" id="btnRefresh">🔃 Refresh</button></div><div class="table-wrap"><table class="grid"><thead><tr><th>Category ID</th><th>Category Name</th><th>Description</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></div><form id="entityForm" class="split-form" novalidate><div class="field"><label>Category ID</label><input type="text" id="rid" readonly placeholder="Auto"></div><div class="field"><label>Category Name</label><input type="text" id="name" required maxlength="100"></div><div class="field"><label>Description</label><textarea id="description" maxlength="255"></textarea></div><div class="field"><label>Status</label><select id="status" required><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="btn-row"><button type="button" class="btn" id="btnSave">💾 Save</button><button type="button" class="btn" id="btnUpdate">✏️ Update</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><button type="button" class="btn" id="btnDelete">🗑️ Delete</button><button type="button" class="btn" id="btnClose">❌ Close</button></div></form></div></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
