<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Orders - Inventory Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div id="nav"></div>
<div class="panel"><h1 class="panel-title">Manage Orders</h1>
<form id="entityForm" novalidate><div class="split"><div>
<div class="box">
<div class="field-row">
<div class="field"><label>Customer</label><select id="customerId"></select></div>
<div class="field"><label>Order Number</label><input type="text" id="orderNumber" readonly placeholder="Generated on save"></div>
</div>
<div class="field-row">
<div class="field"><label>Product</label><select id="productId"></select></div>
<div class="field-row"><div class="field"><label>Quantity</label><input type="number" id="qty" min="1" value="1"></div>
<div class="field"><label>Price</label><input type="text" id="price" readonly></div></div>
</div>
<button type="button" class="btn" id="btnAdd">➕ Add Product</button>
</div>
<div class="table-wrap mt"><table class="grid"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th><th></th></tr></thead><tbody id="cartBody"></tbody></table></div>
</div>
<div class="split-form">
<div class="field"><label>Discount (%)</label><input type="number" id="discount" min="0" max="100" step="0.01" value="0"></div>
<div class="field"><label>Payment Status</label><select id="paymentStatus"><option>Unpaid</option><option>Paid</option><option>Partial</option></select></div>
<div class="totals"><div><span>Subtotal</span><span id="subtotal">0.00</span></div><div><span>Discount</span><span id="discountAmt">0.00</span></div><div class="grand"><span>Total</span><span id="total">0.00</span></div></div>
<div class="btn-row"><button type="button" class="btn" id="btnSaveOrder">💾 Save Order</button><button type="button" class="btn" id="btnReset">🔄 Reset</button><a class="btn" href="view-orders.html">📋 View Orders</a><button type="button" class="btn" id="btnClose">❌ Close</button></div>
</div></div></form></div>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
