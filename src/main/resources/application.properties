spring.application.name=inventory-management-system
server.port=8080
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.upload-dir=uploads
app.admin.name=Administrator
app.admin.email=${ADMIN_EMAIL:admin@inventory.local}
app.admin.password=${ADMIN_PASSWORD:}
